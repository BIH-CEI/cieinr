name: Validate Version

on:
  pull_request:
    paths:
      - 'src/cieinr/_version.py'
  push:
    paths:
      - 'src/cieinr/_version.py'

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Check version format
        run: |
          VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/cieinr/_version.py)
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version '$VERSION' is not in valid semver format (X.Y.Z)"
            exit 1
          fi
          echo "Version $VERSION is valid"

      - name: Check version is incremented (on main branch PRs only)
        if: github.base_ref == 'main' && github.event_name == 'pull_request'
        run: |
          # Get the current version
          CURRENT_VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/cieinr/_version.py)
          echo "Current version: $CURRENT_VERSION"
          
          # Get the previous version from the base branch
          git checkout ${{ github.base_ref }}
          PREVIOUS_VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/cieinr/_version.py)
          echo "Previous version: $PREVIOUS_VERSION"
          
          # Compare versions using semver logic
          python -c "
          from packaging import version
          current = version.parse('$CURRENT_VERSION')
          previous = version.parse('$PREVIOUS_VERSION')
          if not current > previous:
              print(f'Error: New version {current} is not greater than previous version {previous}')
              exit(1)
          print(f'Version has been properly incremented from {previous} to {current}')
          "
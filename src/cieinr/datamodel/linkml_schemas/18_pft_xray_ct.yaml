id: https://github.com/BIH-CEI/cieinr/src/cieinr/datamodel/linkml_schemas/18_pft_xray_ct.yaml
name: 18_pft_xray_ct
description: >
  Pulmonary function test (PFT), chest x-ray, and CT chest form capturing test type, date, FEV1, and imaging results.
prefixes:
  linkml: https://w3id.org/linkml/
  cieinr: https://github.com/BIH-CEI/cieinr
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  SNOMEDCT: http://purl.obolibrary.org/obo/SNOMEDCT_
imports:
  - linkml:types
  - cieinr_types
  - cieinr_code_systems
default_range: string
default_prefix: cieinr

classes:
  PFTChestXrayCT:
    description: >
      Pulmonary function test (PFT), chest x-ray, and CT chest form capturing test type, date, FEV1, and imaging results.
    slots:
      - completion_date_pft
      - procedure_1
      - pftannualmonth
      - pftannualyear
      - date_chest_xray
      - fev1_annual
      - xray_results_annual
      - pdf_chest_xray_annual
      - hrct_result_annual
      - pdf_chest_ct_annual
      - other_investigations_1
      - other_investigation

slots:
  completion_date_pft:
    title: Date of completing this form.
    description: >
      Date of completing this form.
    range: union_date_string
    required: false

  procedure_1:
    title: Please choose the test performed
    description: >
      Please choose the test performed
    range: Procedure1Enum
    required: false

  pftannualmonth:
    title: Month
    description: >
      Month
    range: integer
    required: false

  pftannualyear:
    title: Year
    description: >
      Year
    range: integer
    required: false

  date_chest_xray:
    title: Please provide the time point when test was done
    description: >
      Please provide the time point when test was done
    range: TestTimingEnum
    required: false

  fev1_annual:
    title: What was the Forced Expiratory Volume in 1 second (FEV1) (% of predicted)?
    description: >
      What was the Forced Expiratory Volume in 1 second (FEV1) (% of predicted)?
    range: string
    required: false

  xray_results_annual:
    title: Please indicate the results of the chest xray:
    description: >
      Please indicate the results of the chest xray:
    range: NormalAbnormalEnum
    required: false

  pdf_chest_xray_annual:
    title: Please upload the chest x-ray pdf test results. REMOVE PATIENT'S PERSONAL INFORMATION (NAME, MRN, UL
    description: >
      Please upload the chest x-ray pdf test results. REMOVE PATIENT'S PERSONAL INFORMATION (NAME, MRN, ULI, DOB)
    range: string
    required: false

  hrct_result_annual:
    title: Please indicate the results of the CT chest:
    description: >
      Please indicate the results of the CT chest:
    range: NormalAbnormalEnum
    required: false

  pdf_chest_ct_annual:
    title: Please upload the CT chest pdf test results. REMOVE PATIENT'S PERSONAL INFORMATION (NAME, MRN, ULI, 
    description: >
      Please upload the CT chest pdf test results. REMOVE PATIENT'S PERSONAL INFORMATION (NAME, MRN, ULI, DOB)
    range: string
    required: false

  other_investigations_1:
    title: Please comment if other investigations were done and the result (MRIs, CT scans, X-rays):
    description: >
      Please comment if other investigations were done and the result (MRIs, CT scans, X-rays):  Please upload pdf(s) of the test results.  REMOVE PATIENT'S PERSONAL INFORMATION (NAME, MRN, ULI, DOB)  {othe
    range: string
    required: false

  other_investigation:
    title: 
    description: >
      
    range: string
    required: false

enums:
    TestTimingEnum:
      description: >
        Enumeration for test timing
      permissible_values:
        ncit_c54734:
          description: Before Treatment/ Baseline diagnosis
          meaning: NCIT:C54734
        ncit_c54735:
          description: Post Treatment
          meaning: NCIT:C54735
        ncit_c25280:
          description: Most recent test
          meaning: NCIT:C25280

    NormalAbnormalEnum:
      description: >
        Enumeration for normal/abnormal result
      permissible_values:
        ncit_c14165:
          description: normal
          meaning: NCIT:C14165
        ncit_c25401:
          description: abnormal
          meaning: NCIT:C25401

    Procedure1Enum:
      description: >
        Enumeration for Please choose the test performed
      permissible_values:
        snomedct_23426006:
          description: Pulmonary Function Test (PFT)
          meaning: SNOMEDCT:23426006
        snomedct_399208008:
          description: Chest x-ray
          meaning: SNOMEDCT:399208008
        snomedct_169069000:
          description: Computed Tomography (CT) chest
          meaning: SNOMEDCT:169069000
        "4":
          description: None

    range: DrugAllergy3Enum
    required: false

  drug_allergy_2:
    title: Drug Allergy - Please indicate the name of medication causing allergy: {drug_allergy_name}
    description: >
      Drug Allergy - Please indicate the name of medication causing allergy: {drug_allergy_name}
    range: DrugAllergy2Enum
    required: false

  drug_allergy_name:
    title: drugallergy_name_v2
    description: >

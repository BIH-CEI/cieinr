      Other allergens that cause reactions - Please specify: {other_allergens_spec}
    range: OtherAllergensEnum
    required: false

  drug_allergies:
    title: How many drug allergies does this patient have?
    description: >
      How many drug allergies does this patient have?
    range: DrugAllergiesEnum
    required: false

  drug_allergy:
    title: Drug Allergy - Please indicate the name of medication causing allergy: {drug_allergy_name_5}
    description: >
      Drug Allergy - Please indicate the name of medication causing allergy: {drug_allergy_name_5}
    range: DrugAllergyEnum
    required: false

  drug_allergy_5:
    title: Drug Allergy - Please indicate the name of medication causing allergy: {drug_allergy_name_4}

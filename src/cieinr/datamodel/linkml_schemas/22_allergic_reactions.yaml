id: https://github.com/BIH-CEI/cieinr/src/cieinr/datamodel/linkml_schemas/22_allergic_reactions.yaml
name: 22_allergic_reactions
description: >
  Allergic reactions form capturing food allergies, environmental allergies, and drug allergies with reaction types and medication details.
prefixes:
  linkml: https://w3id.org/linkml/
  cieinr: https://github.com/BIH-CEI/cieinr
imports:
  - linkml:types
  - cieinr_types
  - cieinr_code_systems
default_range: string
default_prefix: cieinr

classes:
  AllergicReactions:
    description: >
      Allergic reactions form capturing food allergies, environmental allergies, and drug allergies with reaction types and medication details.
    slots:
      - completion_date_allergy
      - allergy_yes_no
      - peanut_allergy
      - tree_nut_allergy
      - sea_product_allergy
      - milk_allergy
      - allergy_yolk
      - egg_white_allergy
      - other_food_allergy
      - cat_allergy
      - dog_allergy
      - feather_allergy
      - mouse_allergy
      - tree_allergy
      - grass_allergy
      - weeds_allergy
      - dust_allergy
      - mold_allergy
      - other_allergens
      - drug_allergies
      - drug_allergy
      - drug_allergy_5
      - drug_allergy_4
      - drug_allergy_3
      - drug_allergy_2
      - drug_allergy_name
      - drug_allergy_name_2
      - drug_allergy_name_3
      - drug_allergy_name_4
      - drug_allergy_name_5
      - other_food_spec
      - other_allergens_spec

slots:
  completion_date_allergy:
    title: Date of completing this form.
    description: >
      Date of completing this form.
    range: union_date_string
    required: false

  allergy_yes_no:
    title: Does the patient have any allergies?
    description: >
      Does the patient have any allergies?
    range: boolean
    required: false

  peanut_allergy:
    title: Food allergy to peanuts
    description: >
      Food allergy to peanuts
    range: PeanutAllergyEnum
    required: false

  tree_nut_allergy:
    title: Food allergy to tree nuts (almond, cashew, brazil nut, hazelnut, walnut, pecan, pistachio)
    description: >
      Food allergy to tree nuts (almond, cashew, brazil nut, hazelnut, walnut, pecan, pistachio)
    range: TreeNutAllergyEnum
    required: false

  sea_product_allergy:
    title: Food allergy to sea products (crab, shrimp, tuna, salmon, etc).
    description: >
      Food allergy to sea products (crab, shrimp, tuna, salmon, etc).
    range: SeaProductAllergyEnum
    required: false

  milk_allergy:
    title: Food allergy to milk
    description: >
      Food allergy to milk
    range: MilkAllergyEnum
    required: false

  allergy_yolk:
    title: Food allergy to egg yolk
    description: >
      Food allergy to egg yolk
    range: AllergyYolkEnum
    required: false

  egg_white_allergy:
    title: Food allergy to egg whites
    description: >
      Food allergy to egg whites
    range: EggWhiteAllergyEnum
    required: false

  other_food_allergy:
    title: Other food allergies - Please specify: {other_food_spec}
    description: >
      Other food allergies - Please specify: {other_food_spec}
    range: OtherFoodAllergyEnum
    required: false

  cat_allergy:
    title: Cats
    description: >
      Cats
    range: CatAllergyEnum
    required: false

  dog_allergy:
    title: Dogs
    description: >
      Dogs
    range: DogAllergyEnum
    required: false

  feather_allergy:
    title: Feathers
    description: >
      Feathers
    range: FeatherAllergyEnum
    required: false

  mouse_allergy:
    title: Mice
    description: >
      Mice
    range: MouseAllergyEnum
    required: false

  tree_allergy:
    title: Trees
    description: >
      Trees
    range: TreeAllergyEnum
    required: false

  grass_allergy:

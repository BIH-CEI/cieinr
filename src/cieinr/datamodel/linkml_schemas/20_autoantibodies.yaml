id: https://github.com/BIH-CEI/cieinr/src/cieinr/datamodel/linkml_schemas/20_autoantibodies.yaml
name: 20_autoantibodies
description: >
  Autoantibodies form capturing test timing and results for ANA, ANCA, ENA, anti-TPO, anti-platelet, IgA tTG, DAT, and other autoantibody tests.
prefixes:
  linkml: https://w3id.org/linkml/
  cieinr: https://github.com/BIH-CEI/cieinr
  NCIT: http://purl.obolibrary.org/obo/NCIT_
imports:
  - linkml:types
  - cieinr_types
  - cieinr_code_systems
default_range: string
default_prefix: cieinr

classes:
  Autoantibodies:
    description: >
      Autoantibodies form capturing test timing and results for ANA, ANCA, ENA, anti-TPO, anti-platelet, IgA tTG, DAT, and other autoantibody tests.
    slots:
      - completion_date_autoanti
      - autoanti_no_testing
      - autoantibodies_normal_neg
      - autoantibodies_test
      - autoanti_ana_val
      - anamonth
      - anayear
      - autoanti_anca_val
      - ancamonth
      - ancayear
      - autoanti_ena_val
      - enamonth
      - enayear
      - autoanti_anti_tpo_val
      - tpomonth
      - tpoyear
      - autoanti_anti_plat_val
      - antiplatemonth
      - antiplateyear
      - autoanti_iga_ttg_val
      - igattgmonth
      - igattgyear
      - autoanti_dat_val
      - datmonth
      - datyear
      - other_autoanti_test
      - other_autoanti_val
      - otherantibody1month
      - otherantibody1year
      - other_autoanti_test_2
      - other_autoanti_val_2
      - otherantibody2month
      - otherantibody2year
      - other_autoanti_test_3
      - other_autoanti_val_3
      - otherantibody3month
      - otherantibody3year
      - other_autoanti_test_4
      - other_autoanti_val_4
      - otherantibody4month
      - otherantibody4year
      - autoantibodyfiles

slots:
  completion_date_autoanti:
    title: Date of completing this form.
    description: >
      Date of completing this form.
    range: union_date_string
    required: false

  autoanti_no_testing:
    title: Participant has had testing.
    description: >
      Participant has had testing.
    range: boolean
    required: false

  autoantibodies_normal_neg:
    title: Participant's results were normal/ negative
    description: >
      Participant's results were normal/ negative
    range: boolean
    required: false

  autoantibodies_test:
    title: Please provide the following information at EACH designated time point in the dropdown list. Select 
    description: >
      Please provide the following information at EACH designated time point in the dropdown list. Select the appropriate box for the information you are providing:
    range: TestTimingEnum
    required: false

  autoanti_ana_val:
    title: Antinuclear antibody (ANA) Test Result
    description: >
      Antinuclear antibody (ANA) Test Result  (only titers >1:160 are considered positive)
    range: AutoantiAnaValEnum
    required: false

  anamonth:
    title: Month
    description: >
      Month
    range: integer
    required: false

  anayear:
    title: Year
    description: >
      Year
    range: integer
    required: false

  autoanti_anca_val:

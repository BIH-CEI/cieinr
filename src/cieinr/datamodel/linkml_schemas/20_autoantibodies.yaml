enums:
    TestTimingEnum:
      description: >
        Enumeration for test timing
      permissible_values:
        ncit_c54734:
          description: Before Treatment/ Baseline diagnosis
          meaning: NCIT:C54734
        ncit_c54735:
          description: Post Treatment
          meaning: NCIT:C54735
        ncit_c25280:
          description: Most recent test
          meaning: NCIT:C25280

    AutoantiAnaValEnum:
      description: >
        Enumeration for Antinuclear antibody (ANA) Test Result

id: https://github.com/BIH-CEI/cieinr/src/cieinr/datamodel/linkml_schemas/33_death_form.yaml
name: 33_death_form
description: >
  Death form capturing date of death, cause(s) of death, and additional details.
prefixes:
  linkml: https://w3id.org/linkml/
  cieinr: https://github.com/BIH-CEI/cieinr
  LOINC: http://loinc.org/
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  SNOMEDCT: http://purl.obolibrary.org/obo/SNOMEDCT_
imports:
  - linkml:types
  - cieinr_types
  - cieinr_code_systems
default_range: string
default_prefix: cieinr

classes:
  DeathForm:
    description: >
      Death form capturing date of death, cause(s) of death, and additional details.
    slots:
      - completion_date_death
      - died_yesorno
      - deathmonth
      - deathyear
      - snomedct_184305005
      - snomedct_184305005_other
      - unknown_death

slots:
  completion_date_death:
    title: Date of completing this form.
    description: >
      Date of completing this form.
    range: union_date_string
    required: false

  died_yesorno:
    title: Has this patient died?
    description: >
      Has this patient died?
    range: boolean
    required: false

  deathmonth:
    title: Month
    description: >
      Month
    range: integer
    required: false

  deathyear:
    title: Year
    description: >
      Year
    range: integer
    required: false

  snomedct_184305005:
    title: Please, indicate the cause(s) of death
    description: >
      Please, indicate the cause(s) of death
    range: Snomedct184305005Enum
    required: false

  snomedct_184305005_other:
    title: Please, describe the possible cause of death searching in MONDO.
    description: >
      Please, describe the possible cause of death searching in MONDO.
    range: string
    required: false

  unknown_death:
    title: Please describe the situation if the cause of death is unknown
    description: >
      Please describe the situation if the cause of death is unknown
    range: string
    required: false

enums:

    Snomedct184305005Enum:
      description: >
        Enumeration for Please, indicate the cause(s) of death
      permissible_values:
        snomedct_58606001:
          description: Immunodeficiency
          meaning: SNOMEDCT:58606001
        mondo_0005070:
          description: Malignancy
          meaning: MONDO:0005070
        mondo_0005550:
          description: Infection
          meaning: MONDO:0005550
        "4":
          description: Autoimmunity ( to code)
        "loinc_Ia46-8":
          description: Other
          meaning: LOINC:Ia46-8
        snomedct_261665006:
          description: Unknown
          meaning: SNOMEDCT:261665006

id: https://github.com/YourOrg/CIEINR/cieinr.yaml
name: cieinr
description: National Inborn Errors of Immunity Registry in Canada - Simplified Model for Phenopackets Export
prefixes:
  linkml: https://w3id.org/linkml/
  cieinr: https://github.com/YourOrg/CIEINR/
  MONDO: https://purl.obolibrary.org/obo/MONDO_
  SNOMEDCT: http://snomed.info/sct/
imports:
  - linkml:types
  - cieinr_code_systems
  - cieinr_repeated_elements
  - cieinr_types
  # Import only the three forms we're focusing on
  - basic_form
  - patient_demographics_initial_form
  - infections_initial_form

default_prefix: cieinr
default_range: string

classes:
  Record:
    description: >
      Base class for all records, containing only fields needed for Phenopackets export.
    slots:
      - record_id
      - basic_form
      - patient_demographics_initial
      - repeated_elements
    tree_root: true

slots:
  record_id:
    description: The unique record identifier assigned by the REDCap project
    range: string
    required: true
    identifier: true

  basic_form:
    description: Basic IEI diagnosis information
    range: BasicForm
    required: false
    inlined: true

  patient_demographics_initial:
    description: Initial patient demographics data
    range: PatientDemographicsInitial
    required: false
    inlined: true

  repeated_elements:
    description: Container for repeated elements
    multivalued: true
    inlined_as_list: true
    range: RepeatedElement
id: https://github.com/BIH-CEI/cieinr/src/cieinr/v1_0_0/limkml_schemas/form_1_basic.yaml
name: basic_form
description: Basic form containing IEI diagnosis information for Phenopackets export
prefixes:
  linkml: https://w3id.org/linkml/
  cieinr: https://github.com/BIH-CEI/cieinr
  MONDO: https://purl.obolibrary.org/obo/MONDO_
imports:
  - linkml:types
  - cieinr_types
  - cieinr_code_systems
default_range: string
default_prefix: cieinr

classes:
  BasicForm:
    description: >
      The basic form containing the IEI diagnosis information needed for Phenopackets export.
    slots:
      - iei_deficiency_basic
      - basic_form_complete

slots:
  iei_deficiency_basic:
    title: IEI deficiency diagnosis or carrier status (IUIS 2024)
    description: >
      The IEI deficiency diagnosis or carrier status for the participant 
      according to the IUIS 2024 classification.
    range: IUIS2024MONDOEnum
    required: false
    comments: >
      This field contains an extensive list of IEI deficiencies with MONDO codes.
      Tip: use the IUIS 2024 classification. If not found, search in MONDO.

  basic_form_complete:
    title: Form completion status
    description: >
      Indicates the completion status of the basic form.
    range: CompletionStatusEnumBasicForm
    required: true

enums:
  CompletionStatusEnumBasicForm:
    description: >
      Enumeration for form completion status
    permissible_values:
      "0":
        description: Incomplete
      "1":
        description: Unverified
      "2":
        description: Complete

